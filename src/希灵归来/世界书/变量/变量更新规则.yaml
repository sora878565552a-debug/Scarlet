---
变量更新规则:
  普通矿物:
    type: number
    check:
      - 只有当矿机实际采出矿物，或{{user}}明确下令消耗、转化时，才增减该项
      - 采集量按矿机台数计算，几台矿机就是几点；不得一次给出巨量矿物
 导能晶体:
    type: number
    check:
      - 同普通矿物，只在矿机实际采出或实际消耗时变动
      - 它不能转化为普通能量，只在恢复对应设施时扣减
  高密度矿石:
    type: number
    check:
      - 同普通矿物，只在矿机实际采出或实际消耗时变动
      - 它不能转化为普通能量，只在恢复对应设施时扣减
  普通能量:
    type: number
    range: 0~999
    check:
      - 20 点普通矿物转化为 1 点普通能量；转化必须由{{user}}下令或明确同意后才结算
      - 每恢复一项设施固定扣减 5 点
      - 维持舰桥、转化装置、休眠舱、矿机机库与渡鸦投影的日常运转本身不额外扣点，已在现状内
      - 不得为负数；不足时该动作不成立，应让正文表现为做不到
  幽能:
    type: number
    check:
      - 只要{{user}}还在地球上，该项恒为 0，任何事件都不得使它增加
      - 正文中不得出现他取得幽能、或靠幽能启动跃迁的描写
  设施状态:
    type: '{"舰桥"|"转化装置"|"休眠舱"|"矿机机库"|"工兵库"|"武器系统"|"居住舱段"|"医疗舱"|"传感器阵列"|"引擎维修舱"|"货舱"|"自检自修"|"跃迁核心": "运行中"|"未恢复"|"已恢复"|"已损毁"}'
    check:
      - 只有在{{user}}明确启动恢复、且普通能量与对应矿物同时到位时，才把该项从「未恢复」改成「已恢复」
      - 恢复按钮由界面提供，正文不得擅自把设施写成已恢复
      - 恢复采集效率与转化效率消耗普通矿物；生命维持与医疗消耗导能晶体；外勤、航行与结构消耗高密度矿石
      - 工兵库只有在「自检自修」已经是「已恢复」之后才允许恢复
      - 武器系统与跃迁核心在本阶段不得被写成可用
